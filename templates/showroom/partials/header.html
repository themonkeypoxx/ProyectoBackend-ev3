{% load static %}
<header class="fixed top-0 left-0 right-0 z-40 h-16 sm:h-20 px-6 sm:px-12 flex items-center justify-between border-b border-black/[0.06] bg-white/85 backdrop-blur-md transition-all">
  <!-- Izquierda: Logotipo e identidad Stuttgart -->
  <div class="flex items-center gap-4">
    <a href="{% url 'showroom:index' %}" class="group flex items-center gap-3 focus:outline-none" title="Porsche Stuttgart">
      <!-- Escudo estilizado minimalista en negro -->
      <svg class="w-4 h-5 text-black/80 group-hover:text-black transition-colors" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M12 2L2 6V16C2 23 12 28 12 28C12 28 22 23 22 16V6L12 2Z" />
        <path d="M12 2V28" stroke-width="0.7" stroke-dasharray="1 1" />
        <path d="M5 10H19" stroke-width="0.7" />
        <path d="M7 16H17" stroke-width="0.7" />
      </svg>
      <div class="flex flex-col">
        <span class="text-[15px] tracking-[0.42em] font-normal text-black uppercase select-none">
          PORSCHE
        </span>
        <span class="text-[7.5px] tracking-[0.3em] text-zinc-500 uppercase select-none font-light">
          Stuttgart · Alemania
        </span>
      </div>
    </a>
  </div>

  <!-- Centro: Navegación minimalista en fondo blanco -->
  <nav class="hidden md:flex items-center space-x-8 lg:space-x-12">
    <button type="button" class="open-models-trigger group relative py-1 text-[11px] tracking-[0.25em] uppercase font-light text-zinc-600 hover:text-black transition-colors focus:outline-none">
      <span>Modelos</span>
      <span class="absolute bottom-0 left-0 w-0 h-[1px] bg-black group-hover:w-full transition-all duration-300"></span>
    </button>
    <button type="button" class="open-nav-trigger group relative py-1 text-[11px] tracking-[0.25em] uppercase font-light text-zinc-600 hover:text-black transition-colors focus:outline-none">
      <span>Servicios</span>
      <span class="absolute bottom-0 left-0 w-0 h-[1px] bg-black group-hover:w-full transition-all duration-300"></span>
    </button>
    <button type="button" class="open-nav-trigger group relative py-1 text-[11px] tracking-[0.25em] uppercase font-light text-zinc-600 hover:text-black transition-colors focus:outline-none">
      <span>Experiencia</span>
      <span class="absolute bottom-0 left-0 w-0 h-[1px] bg-black group-hover:w-full transition-all duration-300"></span>
    </button>
    <a href="/admin/" target="_blank" class="group relative py-1 text-[10px] font-mono tracking-[0.2em] uppercase text-zinc-400 hover:text-black transition-colors focus:outline-none" title="Panel de Gestión Django">
      <span>Gestión Admin ↗</span>
      <span class="absolute bottom-0 left-0 w-0 h-[1px] bg-black/40 group-hover:w-full transition-all duration-300"></span>
    </a>
  </nav>

  <!-- Derecha: Controles (Sonido, Búsqueda, Menú) -->
  <div class="flex items-center space-x-3 sm:space-x-5">
    <!-- Alternar Sonido -->
    <button id="btn-toggle-sound" type="button" class="p-2 text-zinc-600 hover:text-black transition-colors focus:outline-none" title="Efectos de audio táctil">
      <svg id="sound-icon-muted" class="w-4 h-4 stroke-[1.3]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
      <svg id="sound-icon-active" class="w-4 h-4 stroke-[1.3] hidden text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    </button>

    <!-- Pantalla Completa -->
    <button id="btn-fullscreen" type="button" class="hidden sm:block p-2 text-zinc-600 hover:text-black transition-colors focus:outline-none" title="Pantalla completa">
      <svg class="w-4 h-4 stroke-[1.3]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      </svg>
    </button>

    <!-- Buscador Rápido -->
    <button type="button" class="open-search-trigger flex items-center space-x-2 px-2.5 py-1 rounded-[1px] bg-black/[0.04] hover:bg-black/[0.08] border border-black/[0.07] transition-colors focus:outline-none" title="Buscar modelo (Ctrl+K o Cmd+K)">
      <svg class="w-3.5 h-3.5 text-zinc-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="hidden sm:inline text-[10px] font-mono tracking-widest text-zinc-600 uppercase">Buscar</span>
      <kbd class="hidden lg:inline px-1 py-0.2 text-[8px] font-mono bg-black/5 rounded text-zinc-500">⌘K</kbd>
    </button>

    <!-- Menú Hamburguesa Minimalista -->
    <button type="button" class="open-nav-trigger flex flex-col justify-center items-end space-y-1.5 p-2 focus:outline-none group" title="Menú principal">
      <span class="w-5 h-[1.2px] bg-black transition-all group-hover:w-6"></span>
      <span class="w-3.5 h-[1.2px] bg-black transition-all group-hover:w-6"></span>
    </button>
  </div>
</header>
