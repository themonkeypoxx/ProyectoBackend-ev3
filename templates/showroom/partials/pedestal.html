{% load static %}
<div id="showroom-pedestal-container" class="relative w-full h-[100dvh] min-h-[700px] flex items-center justify-center overflow-hidden select-none bg-[#fbfbfb] cursor-grab active:cursor-grabbing">
  <!-- 1. Iluminación cenital de estudio arquitectónico blanco -->
  <div class="absolute inset-0 bg-white-studio pointer-events-none"></div>

  <!-- 2. Líneas sutiles de la plataforma giratoria blanca -->
  <div class="absolute bottom-[23%] sm:bottom-[21%] w-[640px] sm:w-[880px] md:w-[1040px] h-[320px] sm:h-[400px] rounded-[100%] border border-black/[0.04] pointer-events-none transform -rotate-x-[75deg] flex items-center justify-center">
    <div class="w-[84%] h-[84%] rounded-[100%] border border-dashed border-black/[0.03]"></div>
    <!-- Sombra de contacto suave en el suelo blanco -->
    <div class="w-[62%] h-[62%] rounded-[100%] pedestal-shadow-white"></div>
  </div>

  <!-- 3. Marca de agua tipográfica ultra-sutil en el fondo -->
  <div class="absolute top-[28%] left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-10 opacity-[0.03] whitespace-nowrap text-center">
    <span id="pedestal-series-watermark" class="text-[14vw] font-black tracking-tighter text-black font-mono uppercase">
      {{ current_car.name }}
    </span>
  </div>

  <!-- 4. Contenedor de visualización 3D del vehículo -->
  <div id="pedestal-car-wrapper" class="relative z-20 w-full max-w-5xl h-[420px] sm:h-[500px] md:h-[560px] flex items-center justify-center transition-transform duration-75 ease-out">
    
    <!-- Canvas WebGL 3D Real (Three.js con GLTFLoader) -->
    <canvas id="three-car-canvas" class="w-full h-full block z-20 cursor-grab active:cursor-grabbing"></canvas>

    <!-- Indicador de carga sutil para el modelo 3D -->
    <div id="pedestal-loading-3d" class="absolute z-30 pointer-events-none flex items-center space-x-2 px-3 py-1.5 bg-white/95 backdrop-blur-md border border-black/[0.08] rounded-full shadow-md text-xs font-mono text-zinc-800">
      <span class="w-2 h-2 rounded-full bg-black animate-ping"></span>
      <span class="tracking-wider uppercase text-[10px]">CARGANDO MODELO 3D REAL...</span>
    </div>

    <!-- Imagen 3D alternativa de estudio (oculta en modo 3D activo) -->
    <div id="pedestal-image-layer" class="relative w-full h-full flex items-center justify-center z-10 hidden pointer-events-none">
      <img
        id="pedestal-hero-image"
        src="{{ current_car.hero_image }}"
        alt="{{ current_car.full_name }}"
        class="w-full h-full object-contain pointer-events-none transition-all duration-300 lighting-studio"
        draggable="false"
      />

      <!-- Puntos de telemetría (Hotspots) -->
      <div id="pedestal-hotspots" class="absolute inset-0 pointer-events-none z-30">
        <!-- Inyectado dinámicamente -->
      </div>
    </div>

    <!-- Reflejo sutil en el suelo blanco pulido -->
    <div id="pedestal-reflection-layer" class="absolute -bottom-[22%] left-0 right-0 h-[32%] overflow-hidden opacity-15 pointer-events-none transform scale-y-[-1] blur-[3px] hidden">
      <img
        id="pedestal-hero-reflection"
        src="{{ current_car.hero_image }}"
        alt="Reflejo"
        class="w-full h-full object-contain pointer-events-none"
        draggable="false"
      />
    </div>
  </div>

  <!-- 5. Controles superiores discretos en estilo minimalista blanco -->
  <div class="absolute top-20 sm:top-24 left-6 sm:left-12 z-30 flex items-center space-x-2.5 pointer-events-auto">
    <!-- Alternador Modo 3D WebGL / Estudio 3D -->
    <button id="btn-toggle-3d-mode" type="button" class="flex items-center space-x-1.5 px-3 py-1.5 bg-black text-white hover:bg-zinc-800 shadow-sm rounded-[1px] text-[10px] font-mono tracking-wider uppercase transition-colors focus:outline-none" title="Cambiar modo de visualización 3D">
      <svg class="w-3.5 h-3.5 stroke-[1.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span id="btn-3d-label">MODELO 3D REAL (GLTF)</span>
    </button>

    <!-- Ángulo de rotación -->
    <div class="flex items-center space-x-1.5 px-2.5 py-1.5 bg-white/90 backdrop-blur-md border border-black/[0.08] rounded-[1px] text-[9.5px] font-mono text-zinc-600 shadow-sm">
      <span class="w-1.5 h-1.5 rounded-full bg-red-600"></span>
      <span class="tracking-widest uppercase">ÁNGULO:</span>
      <span id="pedestal-compass-angle" class="font-medium text-black">24°</span>
    </div>

    <!-- Giro automático 360° -->
    <button id="btn-autorotate" type="button" class="flex items-center space-x-1.5 px-2.5 py-1.5 bg-white/90 hover:bg-black hover:text-white backdrop-blur-md border border-black/[0.08] rounded-[1px] text-[9.5px] font-mono text-zinc-700 transition-colors focus:outline-none shadow-sm" title="Rotación continua 360°">
      <svg class="w-3.5 h-3.5 stroke-[1.3]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span class="hidden sm:inline tracking-widest uppercase">GIRO 360°</span>
    </button>

    <!-- Puntos de telemetría 3D -->
    <button id="btn-toggle-hotspots" type="button" class="flex items-center space-x-1.5 px-2.5 py-1.5 bg-white/90 hover:bg-black hover:text-white backdrop-blur-md border border-black/[0.08] rounded-[1px] text-[9.5px] font-mono text-zinc-700 transition-colors focus:outline-none shadow-sm" title="Mostrar u ocultar especificaciones">
      <svg class="w-3.5 h-3.5 stroke-[1.3]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span class="hidden sm:inline tracking-widest uppercase">PUNTOS 3D</span>
    </button>
  </div>

  <!-- Iluminación de estudio (Superior derecha) -->
  <div class="absolute top-20 sm:top-24 right-6 sm:right-12 z-30 hidden sm:flex items-center space-x-2 px-3 py-1.5 bg-white/90 backdrop-blur-md border border-black/[0.08] rounded-[1px] text-[9.5px] font-mono pointer-events-auto shadow-sm">
    <span class="text-zinc-500 tracking-widest uppercase mr-1">LUZ:</span>
    <button type="button" data-preset="studio" class="lighting-preset-btn text-black font-semibold px-1 focus:outline-none">ESTUDIO</button>
    <span class="text-black/10">/</span>
    <button type="button" data-preset="dramatic" class="lighting-preset-btn text-zinc-400 hover:text-black px-1 focus:outline-none">DRAMÁTICA</button>
    <span class="text-black/10">/</span>
    <button type="button" data-preset="ambient" class="lighting-preset-btn text-zinc-400 hover:text-black px-1 focus:outline-none">AMBIENTE</button>
  </div>

  <!-- 6. Selector de color minimalista en el pedestal blanco -->
  <div class="absolute bottom-[23%] sm:bottom-[21%] left-1/2 -translate-x-1/2 z-30 flex flex-col items-center space-y-1.5 pointer-events-auto">
    <div id="pedestal-color-swatches" class="flex items-center space-x-2 px-3.5 py-1.5 bg-white/90 backdrop-blur-xl border border-black/[0.08] rounded-full shadow-md">
      <!-- Inyectado dinámicamente -->
    </div>
    <div id="pedestal-color-name" class="text-[9.5px] font-mono tracking-[0.25em] text-zinc-600 uppercase">
      <!-- Inyectado dinámicamente -->
    </div>
  </div>
</div>
