{% load static %}
<div class="absolute bottom-0 left-0 right-0 h-[18%] min-h-[120px] z-30 flex flex-col justify-end pb-7 pointer-events-none select-none">
  <!-- Degradado suave inferior en blanco -->
  <div class="absolute inset-0 bg-gradient-to-t from-[#fbfbfb] via-[#fbfbfb]/80 to-transparent pointer-events-none"></div>

  <div class="relative w-full max-w-[1720px] mx-auto px-6 sm:px-12 flex flex-col items-center justify-center">
    <!-- Contenedor del selector horizontal -->
    <div class="relative w-full overflow-hidden flex items-center justify-center pointer-events-auto carousel-mask-white">
      <div id="carousel-items-container" class="flex items-center justify-center space-x-6 sm:space-x-12 md:space-x-16 py-1.5 transition-all duration-500 ease-out">
        <!-- Inyectado dinámicamente -->
      </div>
    </div>

    <!-- Puntos de navegación discretos en negro -->
    <div id="carousel-dots" class="flex items-center space-x-1.5 mt-3 pointer-events-auto">
      <!-- Inyectado dinámicamente -->
    </div>
  </div>
</div>
